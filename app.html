<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* tek üye kabuğu: eski uye.html + benim.html buraya taşındı (#uye / #benim).
   Görünüm scriptleri olduğu gibi kalır; kabuk doğru DOM'u kurup scriptleri
   sırayla enjekte eder. Hash değişince temiz init için sayfa yenilenir. */
(function () {
  const VIEWS = {
    uye: {
      title: "üyelik — kim kime ne satıyor?",
      html: '<main class="center"><div class="center-in">' +
            '<h1 class="serif">kendi akışını kur</h1>' +
            '<p class="pitchlede">Ülke ve konu seç; anasayfan sana özel aksın. Takip ettiklerinde gelişme olunca kürende işaretlenir, kişisel akışın hep güncel kalır. Gerçek veri, gürültü yok.</p>' +
            '<div class="authbox" id="auth"><p class="loading">yükleniyor…</p></div>' +
            '</div></main>',
      js: ["js/store.js?v=48", "js/takip.js?v=1", "js/auth.js?v=5"],
    },
    benim: {
      title: "benim akışım — kim kime ne satıyor?",
      html: '<main class="wrap"><div id="app"><p class="loading">yükleniyor…</p></div></main>',
      js: ["js/store.js?v=48", "js/takip.js?v=1", "js/benim.js?v=4"],
    },
  };
  const name = (location.hash || "#uye").slice(1).split("?")[0];
  const v = VIEWS[name] || VIEWS.uye;
  document.title = v.title;
  document.getElementById("view").innerHTML = v.html;
  for (const src of v.js) {
    const s = document.createElement("script");
    s.src = src; s.async = false;
    document.body.appendChild(s);
  }
  addEventListener("hashchange", () => location.reload());
})();
</script>
</body>
</html>
