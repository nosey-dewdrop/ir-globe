name: refresh news

# real, current articles per relationship — fetched server-side (no CORS, no key),
# committed back so the static site always shows fresh, verified news.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours — keep the flow fresh
  workflow_dispatch: {}      # and on manual run

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: fetch news
        run: node scripts/fetch-news.js
      # deterministic relation-extraction engine over the fresh headlines,
      # then the consolidated event index (dedupe + weekly pair series)
      - name: extract relations
        run: |
          node scripts/extract-relations.js
          node scripts/build-event-index.js
          node scripts/build-ozet.js
          node scripts/build-graph.js
      - name: commit if changed
        run: |
          git config user.name "damlahelloworld-bot"
          git config user.email "noreply@damlahelloworld.com"
          git add data/news data/events data/ml
          if ! git diff --cached --quiet; then
            git commit -m "refresh news articles"
            git pull --rebase
            git push
          else
            echo "no news change"
          fi
      # supabase free projeyi uyanık tut (7 gün hareketsizlikte duraklıyor)
      - name: keep supabase awake
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "no supabase secret, skip"; exit 0; fi
          curl -s -o /dev/null -w "keep-alive HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/layers?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON" -H "Authorization: Bearer $SUPABASE_ANON"
      # gelişme uyarıları (yalnızca 18 UTC koşusunda gerçekten gönderir)
      - name: send follow alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          BRIEFING_FROM: ${{ secrets.BRIEFING_FROM }}
        run: node scripts/send-alerts.js
