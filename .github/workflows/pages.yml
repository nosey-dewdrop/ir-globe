name: Deploy to GitHub Pages

# Siteyi GitHub Pages'e yayınlar. Statik site — build yok, repo kökü olduğu gibi servis edilir.
on:
  push:
    branches:
      - main
      - claude/kanka-damla-globe-github-ar0zfk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; devam eden run'ı iptal etmeden bitmesini bekle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
